name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: |
          xcodebuild build \
            -project YourApp.xcodeproj \
            -scheme YourApp \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO
