name: iOS Release

on:
  workflow_dispatch:
    inputs:
      destination:
        description: App Store Connect destination
        required: true
        default: testflight
        type: choice
        options: [testflight, production]
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  archive-and-upload:
    runs-on: macos-15
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.destination == 'production') && 'production' || 'testflight' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Validate signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_B64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_B64" && test -n "$IOS_TEAM_ID"
          test -n "$IOS_DISTRIBUTION_CERTIFICATE_B64" && test -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" && test -n "$IOS_PROVISIONING_PROFILE_B64"
      - name: Restore App Store Connect key
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          printf '%s' "$ASC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" "$HOME/.appstoreconnect/private_keys/"
      - name: Install distribution signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_B64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_B64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          printf 'IOS_PROFILE_UUID=%s\n' "$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          xcodebuild archive \
            -project YourApp.xcodeproj \
            -scheme YourApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/YourApp.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual
      - name: Prepare export options
        run: |
          cp exportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Set :method app-store-connect' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Set :signingStyle manual' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.example.app string $IOS_PROFILE_UUID" "$RUNNER_TEMP/ExportOptions.plist"
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/YourApp.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/YourApp.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
